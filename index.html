<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dinesh — Full-Stack Developer & Graphic Designer crafting digital experiences where code, design and motion come together." />
    <meta name="keywords" content="Dinesh Kumar, Full Stack Developer, Graphic Designer, Python, Django, React, Motion, 3D, Portfolio" />
    <meta name="author" content="Dinesh Kumar" />
    <meta name="theme-color" content="#06060b" />
    <meta property="og:title" content="Dinesh — Full-Stack Developer & Graphic Designer" />
    <meta property="og:description" content="I Design. I Build. I Animate. Digital experiences where code, design and motion come together." />
    <meta property="og:image" content="/avatar.jpeg" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/jpeg" href="/avatar.jpeg" />
    <link rel="apple-touch-icon" href="/avatar.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before paint to avoid flash of wrong theme
      ;(function () {
        try {
          var stored = localStorage.getItem('dinesh-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.classList.toggle('light', theme === 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <title>Dinesh — Full-Stack Developer × Graphic Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
